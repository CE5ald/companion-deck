plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.companiondeck'
    compileSdk 35

    defaultConfig {
        applicationId 'com.companiondeck'
        // Android 5.0. The UI is a WebView page, and Lollipop is the oldest release whose
        // WebView is Chromium and updatable through Play - on KitKat it is a frozen
        // Chromium 33 that cannot run this page.
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName '1.0.0'
    }

    // A release is signed with the maintainer's key when its keystore.properties is available, either
    // beside this project or at the path in COMPANIONDECK_KEYSTORE_PROPS. The key never lives in the
    // repository. Without it (anyone building their own copy) the APK is debug-signed, which installs
    // fine but cannot be updated in place by the official releases.
    def keystoreProps = new Properties()
    def keystoreFile = System.getenv('COMPANIONDECK_KEYSTORE_PROPS')
        ? file(System.getenv('COMPANIONDECK_KEYSTORE_PROPS')) : rootProject.file('keystore.properties')
    if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

    signingConfigs {
        if (keystoreProps['storeFile']) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig keystoreProps['storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.version', 'kotlin/**', 'DebugProbesKt.bin']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
