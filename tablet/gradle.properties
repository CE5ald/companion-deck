android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# The module is six Kotlin files, so the separate compile daemon buys nothing and is a
# reliability problem: on machines where it cannot bind a port, Gradle prints a long
# connection failure and then falls back to this anyway, having wasted the attempt.
kotlin.compiler.execution.strategy=in-process
